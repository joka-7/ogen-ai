name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tree-drift:
    name: Generated trees are current
    runs-on: ubuntu-latest
    steps:
      # docs/STRUCTURE.md and the README's summary tree are generated from the
      # real repository. A directory map that nothing verifies drifts silently
      # and ends up actively misleading -- it says which file to open, so being
      # wrong is worse than being absent. This fails the build when either
      # committed tree no longer matches the files on disk.
      #
      # No submodule checkout here: this repo IS the generator's source, so
      # the script is read straight from skills/repo_tree/, not .ai/skills/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the generated trees against the repository
        run: |
          python skills/repo_tree/gen_tree.py --project . --output docs/STRUCTURE.md --check
          python skills/repo_tree/gen_tree.py --project . --output README.md --max-depth 1 --check
