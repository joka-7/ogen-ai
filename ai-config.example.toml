# Copy this to your project root as `ai-config.toml` and edit.
# Then run:  python .ai/bin/ai-sync

[project]
name = "my-project"

[stack]
# Only the fragments you list here get compiled into AGENTS.md.
# Names map to files under .ai/rules/{languages,frameworks,practices}/<name>.md
languages  = ["python", "typescript"]
frameworks = ["react"]
practices  = ["testing", "git-commits", "security", "architecture", "documentation"]

[tools]
# Which assistants to wire up. "agents" (the root AGENTS.md) is always produced.
#   claude   -> CLAUDE.md symlink + .claude/skills + .claude/commands
#               (+ .claude/agents when claude_agents = true below)
#   gemini   -> GEMINI.md symlink + .agents/skills
#               (+ .gemini/commands, .gemini/agents when the options below are true)
#   cursor   -> native AGENTS.md + .cursor/skills (set cursor_mdc below for glob-scoped
#               .mdc rules too; cursor_commands/cursor_agents for the rest)
#   copilot  -> .github/copilot-instructions.md symlink + .github/skills
#               (+ .github/prompts, .github/agents when the options below are true)
#   windsurf -> native AGENTS.md (set windsurf_commands below for .windsurf/workflows)
#   codex    -> native AGENTS.md + .codex/skills. Codex only reads skills from
#               $CODEX_HOME/skills (default ~/.codex/skills, your home directory, not
#               the project) — set CODEX_HOME=<project-root>/.codex (shell profile,
#               .envrc, or CI env config) for Codex to pick up what's wired here. No
#               command or agent port: Codex's commands (custom prompts) are reportedly
#               deprecated in favor of skills, and no custom-agent convention was found.
targets = ["claude", "cursor", "gemini", "copilot"]

[options]
# How generated tool files are placed:
#   "symlink" (default) — CLAUDE.md/GEMINI.md/etc. link to AGENTS.md; skills/commands
#                         link into the submodule. Zero drift, but links dangle in
#                         sandboxes/containers without the initialized submodule, and
#                         break on Windows.
#   "copy"             — real files/dirs written into the project. Portable and
#                         container-safe; re-run ai-sync after pulling rule updates.
link_mode = "symlink"
# Path (relative to project root) to project-specific rules appended verbatim
# to AGENTS.md — build/test commands, "do not touch" boundaries, architecture notes.
local_tail = "ai-config.local.md"

# Use these rules/skills here without ever committing or pushing anything: every
# path this run writes, plus this file and local_tail, get added to
# .git/info/exclude (never your tracked .gitignore), so nothing shows up in
# `git status`, can't be `git add -A`'d by accident, and never reaches origin.
# Ideal for a repo you don't own or don't want to vendor .ai/ into permanently —
# see README.md's "Local-only use" section. Same effect as `ai-sync --local-only`.
local_only = false

# Emit per-language Cursor rules under .cursor/rules/*.mdc with glob scoping.
# Off by default since Cursor reads the root AGENTS.md natively.
cursor_mdc = false

# Install the role subagents (qa, architect, product, engineering-manager, sre,
# senior-dev, ciso, planner, developer, tracker, docs-sync) into .claude/agents,
# enabling /role-review, /role, /sync-tracker, and /sync-docs.
# Off by default: they're opinionated, and a project that doesn't run multi-role
# reviews shouldn't carry eleven agent descriptions in its context.
claude_agents = false

# --- Command and agent ports to other platforms ---
# Every option below adapts commands/claude/*.md and agents/claude/*.md into another
# tool's own convention. All are opt-in text/format transforms, not symlinks, and all
# default to false. Confidence differs per option — read bin/ai-sync's docstring for
# the one you enable before relying on it in a real project; the short version:
#   gemini_commands/gemini_agents   confirmed against Gemini's own docs, fetched directly.
#   cursor_commands/cursor_agents   confirmed against real example files in a public repo.
#   copilot_commands/copilot_agents confirmed against real examples / a community reference
#                                   doc — not Copilot's own primary docs (network-blocked
#                                   here).
#   windsurf_commands               confirmed against one real example file.
# For agents specifically: ciso/planner hold no Bash on Claude, a structural guarantee.
# Gemini and Copilot's own tools: fields can express that (confirmed for Gemini, high
# confidence for Copilot); Cursor's format cannot (confirmed — see cursor_agents), so a
# Cursor-ported ciso/planner carries an explicit weaker-guarantee disclaimer instead of
# silently repeating a claim the format can't back.
cursor_commands = false
cursor_agents = false
gemini_commands = false
gemini_agents = false
copilot_commands = false
copilot_agents = false
windsurf_commands = false

# Warn (not fail) when the assembled AGENTS.md exceeds this many estimated tokens.
# AGENTS.md loads on every turn, so its size is a cost paid whether or not the turn
# needs it — this just keeps that cost visible. The estimate is ~chars/4, a rough
# heuristic, not an exact count. Set to 0 to disable.
token_budget = 6000
